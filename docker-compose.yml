services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: exam
    ports: ["5439:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam"]
      interval: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://exam:exam@db:5432/exam
      OCR_CACHE_DIR: /app/.ocr-cache
    ports: ["3100:3000"]
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./public:/app/public:ro
      - ocrcache:/app/.ocr-cache
volumes:
  pgdata:
  ocrcache:
