# Render Blueprint: one Docker web service + one Postgres database.
# Plan names below are examples; pick plans in the Render dashboard if they have changed.
# Free web services sleep when idle and have little memory (OCR and AI generation need roughly 1 GB), so use a paid plan for real use.
services:
  - type: web
    name: voice-exam
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/courses
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: voice-exam-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_WALLET          # your admin wallet's PUBLIC address
        sync: false
      - key: GEMINI_API_KEY        # optional; enables AI question generation
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: RPC_URL
        value: https://mainnet.base.org
      - key: CHAIN_ID
        value: "8453"
      - key: CHAIN_NAME
        value: base
      - key: EXPLORER_TX_URL
        value: https://basescan.org/tx/
      - key: USDC_ADDRESS
        value: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      - key: CONTRACT_ADDRESS      # your deployed ResultRegistry (see contracts/)
        sync: false
      - key: UNPAID_EXPIRY_DAYS
        value: "5"

databases:
  - name: voice-exam-db
    plan: basic-256mb
